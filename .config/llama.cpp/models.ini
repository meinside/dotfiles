; llama.cpp router model presets — pointed at by the shell, since --models-preset
; has no default path:
;
;   export LLAMA_ARG_MODELS_PRESET="$XDG_CONFIG_HOME/llama.cpp/models.ini"
;
; Keys are llama-server arguments without leading dashes (short forms and
; LLAMA_ARG_* names also work). Precedence: command line > model section > [*].
; Docs: https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md#model-presets
;
; Portability: no absolute paths anywhere in this file. The ini parser expands
; neither `~` nor $VARS, so every artifact is named by HF repo or URL and lands in
; the shared model cache (LLAMA_CACHE, else ~/Library/Caches/llama.cpp on macOS,
; ${XDG_CACHE_HOME:-~/.cache}/llama.cpp on Linux).
; Note: host, port, API key and model alias are controlled by the router and are
; overwritten on load, so they belong in config.ini, not here.

version = 1

[*]
; 64k, not 32k, and the reason is pi's compaction rather than memory. pi compacts at
; `contextWindow - reserveTokens` (16384) and then keeps `keepRecentTokens` (20000)
; of recent turns, so a window only works when 20000 < c - 16384, i.e. c > ~36k. At
; 32768 the post-compaction prompt (system + tool schemas + summary + 20k kept)
; landed *above* the threshold, so compaction could never get back under the window:
; the next tool result overflowed, and pi's overflow recovery is one compact-and-retry
; per turn, after which the turn is dead (with the failed assistant message, and its
; edits, dropped). 65536 leaves ~20k of margin instead.
;
; Affordable because both models here are hybrid-attention: full-attention layers are
; 16/64 (Qwen3.8-27B) and 8/32 (Ornith-1.5-9B), so KV is ~2 GB at 64k for either.
; Budget on this machine: `hw.memsize` 32 GiB, Metal `recommendedMaxWorkingSetSize`
; 24.96 GiB (78%, measured - the "two thirds" rule of thumb is wrong here). 27B Q4_K_M
; is then 15.7 + 2 + ~1 = ~19 GB and the 9B Q5_K_M ~10 GB, both under the ceiling with
; the OS still holding ~10 GB. Raising `iogpu.wired_limit_mb` is not needed.
;
; Not raised further because prefill, not memory, is the real ceiling: ~38 t/s prefill
; on this GPU means a 30k context costs minutes from cold, so a window pi will never
; fill only wastes KV, which llama.cpp allocates in full at load.
;
; WARNING: 65536 here is safe *because* both models are hybrid-attention. A conventional
; GQA model pays KV on every layer - 40 layers x 8 KV heads x 128 head dim is ~160 KB per
; token, i.e. ~10 GB at 64k, five times what either model here costs. When adding such a
; model, give its own `[section]` a smaller `c` (a section value beats `[*]`) rather than
; letting it inherit this one.
c = 65536
; offload everything the backend can take; a no-op on CPU-only builds
ngl = 999
jinja = true
; agent workloads re-send huge prompts; prefill is the bottleneck on Apple GPUs,
; so keep prompt caches unbounded and allow partial reuse via KV shifting.
LLAMA_ARG_CACHE_RAM = -1
cache-reuse = 256
; one client (pi) at a time: all KV to a single slot
parallel = 1
; unload the model (and its KV cache) after this many idle seconds; the next
; request reloads it automatically. Measured here (M1 Pro 32 GB, 27B Q4_K_M) while
; `c` was still 32768, so the re-prefill figures below are now optimistic and want
; re-measuring at 64k:
; sleeping drops wired memory from 21.4 GB to 3.6 GB, but the prompt cache does
; NOT survive it (cache_n=0 on wake), so the first request afterwards pays a full
; re-prefill: 3.6k tokens = 97 s at ~38 t/s, and a real agent context is larger.
; 900 s therefore: longer than the 2-5 min gaps between turns in an active session
; (a turn takes 1.5-2 min at 4 t/s), short enough to release the memory once the
; machine is actually idle. Anything near 300 s pays that penalty mid-session.
sleep-idle-seconds = 900

; Coding-tuned reasoning model (Ornith-1.5-9B, arch `qwen35`, MIT, public repo so no
; $HF_TOKEN needed). Dense 9B: Q5_K_M is 6.6 GB of weights, a third of the 27B's
; footprint, and its chat template is the Qwen3-Coder XML tool-call format that this
; llama.cpp build detects on its own ("Using specialized template: Qwen3-Coder").
; Native context is 262144; the [*] `c = 65536` above still applies and is the
; intended working size — raise per session rather than here.
[ornith-ai/Ornith-1.5-9B-GGUF:Q5_K_M]
hf-repo = ornith-ai/Ornith-1.5-9B-GGUF:Q5_K_M
load-on-startup = false
no-reasoning-preserve = true
; --- optional: image input (the repo ships an mmproj; `input` in models.json says
; text-only until that is confirmed at runtime) ---
; mmproj-url = https://huggingface.co/ornith-ai/Ornith-1.5-9B-GGUF/resolve/main/mmproj-Ornith-1.5-9B-BF16.gguf

; Model id as the router reports it for an HF-cached download, which is what pi's
; /llama "Download model..." produces (same as `llama-server -hf <repo>:<quant>`).
; A section keyed by an existing model id only adds arguments to it.
[orcarouter/Qwen3.8-27B-Uncensored-GGUF:Q4_K_M]
; the model source. Without it this section is listed but has nothing to load; with
; it the router downloads into the shared cache on first load. Once cached, the
; cache entry carries the same name (preset.cpp:356) and merges with this section,
; so there is no duplicate listing.
;
; This repo is GATED ("auto" approval): the download needs a Hugging Face account
; that has accepted the terms on the model page once, plus a valid token in
; $HF_TOKEN (llama-server reads it, or pass --hf-token). Without it the fetch fails
; with HTTP 401. Public repos are unaffected by an invalid token, so a stale
; $HF_TOKEN only shows up here.
hf-repo = orcarouter/Qwen3.8-27B-Uncensored-GGUF:Q4_K_M
load-on-startup = false
; drop older thinking traces from replayed history: less prefill per turn
no-reasoning-preserve = true
; --- optional: image input, fetched into the cache by URL (no local path) ---
; mmproj-url = https://huggingface.co/orcarouter/Qwen3.8-27B-Uncensored-GGUF/resolve/main/mmproj-Qwen3.8-27B-Uncensored-f16.gguf
; --- optional: MTP speculative decoding ---
; this repo embeds the MTP (`nextn`) head in every quant, and `draft-mtp` uses "MTP
; heads from the main model" (docs/speculative.md), so no draft file and no extra
; weights are needed - unlike a repo that ships an MTP sidecar. Untested here.
; spec-type = draft-mtp
; spec-draft-n-max = 2
