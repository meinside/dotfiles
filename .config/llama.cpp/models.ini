; llama.cpp router model presets — pointed at by the shell, since --models-preset
; has no default path:
;
;   export LLAMA_ARG_MODELS_PRESET="$XDG_CONFIG_HOME/llama.cpp/models.ini"
;
; Keys are llama-server arguments without leading dashes (short forms and
; LLAMA_ARG_* names also work). Precedence: command line > model section > [*].
; Docs: https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md#model-presets
;
; Portability: no absolute paths anywhere in this file. The ini parser expands
; neither `~` nor $VARS, so every artifact is named by HF repo or URL and lands in
; the shared model cache (LLAMA_CACHE, else ~/Library/Caches/llama.cpp on macOS,
; ${XDG_CACHE_HOME:-~/.cache}/llama.cpp on Linux).
; Note: host, port, API key and model alias are controlled by the router and are
; overwritten on load, so they belong in config.ini, not here.

version = 1

[*]
; 32k fits comfortably on 32 GB: Qwen3.8-27B has only 16 full-attention layers
; out of 64, so its KV cache is ~1 GB at 32k (~4 GB at 128k). Raise if needed.
c = 32768
; offload everything the backend can take; a no-op on CPU-only builds
ngl = 999
jinja = true
; agent workloads re-send huge prompts; prefill is the bottleneck on Apple GPUs,
; so keep prompt caches unbounded and allow partial reuse via KV shifting.
LLAMA_ARG_CACHE_RAM = -1
cache-reuse = 256
; one client (pi) at a time: all KV to a single slot
parallel = 1
; unload the model (and its KV cache) after this many idle seconds; the next
; request reloads it automatically. Measured here (M1 Pro 32 GB, 27B Q4_K_M):
; sleeping drops wired memory from 21.4 GB to 3.6 GB, but the prompt cache does
; NOT survive it (cache_n=0 on wake), so the first request afterwards pays a full
; re-prefill: 3.6k tokens = 97 s at ~38 t/s, and a real agent context is larger.
; 900 s therefore: longer than the 2-5 min gaps between turns in an active session
; (a turn takes 1.5-2 min at 4 t/s), short enough to release the memory once the
; machine is actually idle. Anything near 300 s pays that penalty mid-session.
sleep-idle-seconds = 900

; Model id as the router reports it for an HF-cached download, which is what pi's
; /llama "Download model..." produces (same as `llama-server -hf <repo>:<quant>`).
; A section keyed by an existing model id only adds arguments to it.
[chimingw/Qwen3.8-27B-Uncensored-OrcaRouter-GGUF:Q4_K_M]
; the model source. Without it this section is listed but has nothing to load; with
; it the router downloads into the shared cache on first load. Once cached, the
; cache entry carries the same name (preset.cpp:356) and merges with this section,
; so there is no duplicate listing.
hf-repo = chimingw/Qwen3.8-27B-Uncensored-OrcaRouter-GGUF:Q4_K_M
load-on-startup = false
; drop older thinking traces from replayed history: less prefill per turn
no-reasoning-preserve = true
; --- optional: image input, fetched into the cache by URL (no local path) ---
; mmproj-url = https://huggingface.co/chimingw/Qwen3.8-27B-Uncensored-OrcaRouter-GGUF/resolve/main/AUX/mmproj-Qwen3.8-27B-Uncensored-OrcaRouter-BF16.gguf
; --- optional: MTP speculative decoding, ~1.3-1.8x tg, +3.2 GB resident ---
; on a 32 GB Mac run `sudo sysctl iogpu.wired_limit_mb=28672` first (16.8 + 3.2 + KV)
; spec-draft-model selects the file inside spec-draft-hf's repo, so it is a repo
; path, not a local one; the repo's own MTP sidecar is not auto-detected because
; llama.cpp matches the keyword "mtp-" case-sensitively against "...-MTP-Q8_0.gguf".
; spec-draft-hf = chimingw/Qwen3.8-27B-Uncensored-OrcaRouter-GGUF
; spec-draft-model = MTP/Qwen3.8-27B-Uncensored-OrcaRouter-MTP-Q8_0.gguf
; spec-type = draft-mtp
; spec-draft-n-max = 2
