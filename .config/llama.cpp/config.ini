; llama.cpp user-level config — auto-loaded by every llama.cpp binary from
; ${XDG_CONFIG_HOME:-~/.config}/llama.cpp/config.ini (common/arg.cpp:717).
; Only the [*] and [default] sections are applied to params; keys a given binary
; does not know are ignored. Precedence: this file < LLAMA_ARG_* env < CLI args.
;
; Keys are llama-server/llama-cli arguments without leading dashes (short forms
; and LLAMA_ARG_* names also work).
;
; Portability: this file is machine-independent on purpose. The ini parser does
; NOT expand `~` or $VARS, and relative paths resolve against the process CWD, so
; nothing here may name a path. The router's preset file is pointed at from the
; shell instead:
;
;   export LLAMA_ARG_MODELS_PRESET="$XDG_CONFIG_HOME/llama.cpp/models.ini"
;
; Per-machine tuning (n-gpu-layers, ctx size, devices) belongs in either
; /etc/llama.cpp/config.ini (system-wide, applied before this file) or in
; LLAMA_ARG_* exports, not here.

version = 1

[*]
; local-only listener. 9931 is llama.cpp's announced future default (PR #26508);
; pinning it here frees the very common 8080 for dev servers and keeps this config
; unaffected when upstream flips the default. pi's own fallback is 8080, so the URL
; must be stored per machine via `/login llama.cpp` (or $LLAMA_BASE_URL).
host = 127.0.0.1
port = 9931
; router-level: never hold more than one model in memory at a time. A 27B Q4 pins
; ~21 GB wired on this 32 GB machine, so a second resident model means swapping.
; Must live here, not in models.ini: the router strips LLAMA_ARG_MODELS_MAX from
; child presets (server-models.cpp, unset_reserved_args).
models-max = 1
